<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b1835"><title>Косточки, танцуйте!</title><link rel="stylesheet" href="styles.css"></head>
<body><main><section class="game-shell" aria-label="Косточки, танцуйте!">
<header class="scene-header"><div><h1>Косточки, танцуйте!</h1><p id="instruction">Найди, кому подходит косточка</p></div><nav aria-label="Управление игрой"><button id="reference-toggle" title="Показать собранных друзей">Образец</button><button id="sound" aria-pressed="false">Звук: выкл.</button><button id="reset" disabled>Сначала</button></nav></header>
<div class="stage"><svg id="board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" aria-label="Три скелета: Луна, Пиппа и Тито"></svg></div>
<aside class="tray"><span class="eyebrow">ЧЬЯ ЭТО КОСТОЧКА?</span><h2 id="piece-title">Соберём друзей?</h2><button id="piece" disabled aria-label="Выбрать деталь"><svg id="piece-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 330" aria-hidden="true"></svg></button><p id="message" role="status" aria-live="polite">Загружаем рисунки…</p><button id="hint" disabled>Подсказка ✧</button><button class="primary" id="start" disabled>Загрузка…</button></aside>
<footer class="scene-footer"><span id="progress">0 / 18</span><div id="dots" aria-hidden="true"></div><span class="footer-tip">Перетащи деталь или выбери её нажатием</span></footer>
</section><p class="outside-note">Все три скелета доступны сразу. Сравнивай форму, длину и изгиб косточек.</p></main>
<dialog id="reference"><button id="reference-close" class="close">Закрыть ×</button><h2>Вот какими станут наши друзья</h2><svg id="reference-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 155 1230 750" role="img" aria-label="Образец собранных скелетов"></svg></dialog>
<div id="ghost" hidden><svg xmlns="http://www.w3.org/2000/svg" id="ghost-art" aria-hidden="true"></svg></div>
<script src="data/game-data.js"></script><script src="art.js"></script><script src="engine.js"></script><script src="game.js"></script>
</body></html>
