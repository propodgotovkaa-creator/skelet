/* Non-destructive sprite rendering: original PNGs + viewports + optional rig masks. */
(function(root){
'use strict';
function pts(a){return a.map(p=>p.join(',')).join(' ');}
function defs(data,prefix='art',resolver=p=>p){
 const textures=[...new Map(Object.values(data.art).map(a=>[a.textureKey,a])).values()];
 return `<defs>${textures.map(a=>`<image id="${prefix}-texture-${a.textureKey}" href="${resolver(a.texture)}" width="${a.textureSize[0]}" height="${a.textureSize[1]}"/>`).join('')}<filter id="${prefix}-shadow" x="-8%" y="-8%" width="116%" height="116%"><feColorMatrix type="matrix" values="0 0 0 0 .45 0 0 0 0 .36 0 0 0 0 .61 0 0 0 .88 0"/><feDropShadow dx="0" dy="0" stdDeviation="1.1" flood-color="#d6acff" flood-opacity=".55"/></filter></defs>`;
}
function sprite(a,uid,prefix='art',shadow=false,displayBounds=null){
 const b=displayBounds||a.bounds,[x,y,w,h]=b,s=a.sourceRect;
 const picture=`<use href="#${prefix}-texture-${a.textureKey}"/>`;
 const content=shadow?`<defs><mask id="${uid}-alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="${a.textureSize[0]}" height="${a.textureSize[1]}" style="mask-type:alpha">${picture}</mask></defs><rect x="${s[0]}" y="${s[1]}" width="${s[2]}" height="${s[3]}" fill="#9a7db8" fill-opacity=".72" mask="url(#${uid}-alpha)"/>`:picture;
 return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${s.join(' ')}" overflow="hidden" preserveAspectRatio="none" class="sprite ${shadow?'slot-shadow':''}">${content}</svg>`;
}
function character(data,c,prefix,placed=new Set(),complete=false,interactive=false){
 let body='';const order=['arm-left','arm-right','leg-left','leg-right','chest','pelvis'];
 for(const typ of order){
  const a=data.art[c.id+'-'+typ],on=placed.has(a.id),uid=prefix+'-'+a.id;
  body+=`<g id="${prefix}-slot-${a.id}" data-part="${a.id}" class="${on?'installed':'target'} ${typ}" style="transform-origin:${a.pivot[0]}px ${a.pivot[1]}px" ${!on&&interactive?`role="button" tabindex="0" aria-label="${a.label}, ${c.name}"`:''}>${sprite(a,uid,prefix,!on)}`;
  if(on&&complete&&typ==='arm-right'&&c.id==='luna')body+=sprite(data.art['luna-maraca'],uid+'-prop',prefix);
  if(on&&complete&&typ==='arm-left'&&c.id==='tito')body+=sprite(data.art['tito-maraca'],uid+'-prop',prefix);
  body+='</g>';
 }
 body+=`<g class="head">${sprite(data.art[c.headId],prefix+'-'+c.headId,prefix)}</g>`;
 return `<g class="character" data-character="${c.id}" transform="translate(${c.origin.join(' ')})"><g class="actor">${body}</g><g class="name-tag"><rect x="112" y="652" width="116" height="34" rx="17" fill="#2d1739" fill-opacity=".8" stroke="${c.accent}" stroke-opacity=".4"/><text x="170" y="675" text-anchor="middle" fill="${c.accent}" font-size="17" font-family="Arial,sans-serif">${c.name}</text></g></g>`;
}

</script><script>
(function(root){
'use strict';
class SkeletonEngine{
 constructor(data,random=Math.random){this.data=data;this.random=random;this.parts=new Map(data.parts.map(p=>[p.id,p]));this.characters=new Map(data.characters.map(c=>[c.id,c]));this.phase='ready';this.placed=new Set();this.queue=[];}
 start(){this.placed.clear();this.queue=this.data.parts.map(p=>p.id);for(let i=this.queue.length-1;i>0;i--){const j=Math.floor(this.random()*(i+1));[this.queue[i],this.queue[j]]=[this.queue[j],this.queue[i]];}this.phase='playing';return this.current;}
 get current(){return this.parts.get(this.queue[0])||null;}
 place(id){if(this.phase!=='playing'||id!==this.current?.id)return {ok:false,complete:false};this.placed.add(id);this.queue.shift();const done=this.queue.length===0;if(done)this.phase='complete';return {ok:true,complete:done,characterId:this.parts.get(id).characterId};}
 center(p){const c=this.characters.get(p.characterId),b=p.bounds;return {x:c.origin[0]+b[0]+b[2]/2,y:c.origin[1]+b[1]+b[3]/2};}
 dragTarget(point){let best=null,dist=Infinity;for(const p of this.data.parts){const c=this.center(p),d=Math.hypot(point.x-c.x,point.y-c.y);if(d<dist){best=p;dist=d;}}return dist<=62?best:null;}
 tapTarget(point){let best=null,bestDistance=Infinity;for(const p of this.data.parts){
  const c=this.characters.get(p.characterId),b=p.bounds,m=p.hitMask,rows=m.length,cols=m[0].length;
  const x=point.x-c.origin[0]-b[0],y=point.y-c.origin[1]-b[1];
  if(x < -18||y < -18||x>b[2]+18||y>b[3]+18)continue;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)if(m[j][i]==='1'){
   const cx=(i+.5)*b[2]/cols,cy=(j+.5)*b[3]/rows;
   const dx=Math.max(0,Math.abs(x-cx)-b[2]/cols/2),dy=Math.max(0,Math.abs(y-cy)-b[3]/rows/2),d=Math.hypot(dx,dy);
   if(d<bestDistance){bestDistance=d;best=p;}
  }
 }return bestDistance<=18?best:null;}
}
root.SkeletonEngine=SkeletonEngine;
})(typeof window==='undefined'?globalThis:window);

</script><script>
(() => {
 const segments=decodeURIComponent(location.pathname).split('/');
 const base=new URL(segments.includes('halloween-skeletons 2')?'./':'./halloween-skeletons%202/',location.href);
 window.SKELETON_BACKGROUND=new URL('assets/background.png',base).href;
 for(const a of [...window.SKELETON_GAME_DATA.parts,...Object.values(window.SKELETON_GAME_DATA.art)])a.texture=new URL(a.texture,base).href;
})();
(() => {
'use strict';
const data=window.SKELETON_GAME_DATA,A=window.SkeletonArt,model=new window.SkeletonEngine(data);
const $=id=>document.getElementById(id),board=$('board');
const backgroundURL=window.SKELETON_BACKGROUND||'assets/background.png';
let selected=false,drag=null,loaded=false,loadFailed=false,audio=null;
const mobile=window.matchMedia('(max-width:760px)');
function say(s){$('message').textContent=s;}
function picture(a,prefix,width=240,height=330){const r=a.sourceRect,scale=Math.min((width-24)/r[2],(height-22)/r[3]);return A.defs(data,prefix)+A.sprite(a,prefix+'-piece',prefix,false,[(width-r[2]*scale)/2,(height-r[3]*scale)/2,r[2]*scale,r[3]*scale]);}
function render(){
 board.innerHTML=A.defs(data,'board')+'<image href="'+backgroundURL+'" width="1600" height="1000" preserveAspectRatio="xMidYMid slice"/><rect width="1600" height="1000" fill="#221430" opacity=".13"/>'+data.characters.map(c=>A.character(data,c,'board',model.placed,model.phase==='complete',model.phase==='playing')).join('');
 board.classList.toggle('dancing',model.phase==='complete');
 for(const p of data.parts){const g=$('board-slot-'+p.id);if(g&&!model.placed.has(p.id))g.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selected){e.preventDefault();attempt(p.id);}});}
 $('progress').textContent=`${model.placed.size} / 18`;

}
function showPiece(){
 const p=model.current;selected=false;$('piece').classList.remove('selected','dragging');
 const playing=loaded&&model.phase==='playing';$('piece').disabled=!playing;
 $('piece').setAttribute('aria-pressed','false');
 if(p){$('piece').setAttribute('aria-label',`Выбрать деталь: ${p.label}`);$('piece-art').innerHTML=picture(p,'tray');}
 else{$('piece-art').innerHTML=picture(data.art['tito-maraca'],'tray');}
}
function selectPiece(){if(model.phase!=='playing')return;ensureAudio();selected=true;$('piece').classList.add('selected');$('piece').setAttribute('aria-pressed','true');say('Теперь нажми на подходящую тень.');}
function clearDrag(){if(drag){const id=drag.id;drag=null;try{if($('piece').hasPointerCapture(id))$('piece').releasePointerCapture(id);}catch{}}$('ghost').hidden=true;$('piece').classList.remove('dragging');}
function ensureAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C();}if(audio?.state==='suspended')audio.resume().catch(()=>{});}catch{}}
function tone(freq,duration=.14,delay=0){
 if(document.hidden)return;
 try{ensureAudio();if(!audio||audio.state==='closed')return;
  const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();
  o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.055,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+duration);
  o.connect(g);g.connect(audio.destination);o.onended=()=>{try{o.disconnect();g.disconnect();}catch{}};o.start(t);o.stop(t+duration+.03);
 }catch{ /* Audio must never interrupt placement or leave a stale piece in the tray. */ }
}
function start(){if(!loaded)return;clearDrag();model.start();$('start').hidden=true;$('load-status').hidden=true;render();showPiece();say('Сравни форму и изгиб. Кому подходит эта деталь?');}
function attempt(id){if(model.phase!=='playing')return;const result=model.place(id);if(!result.ok){say('Попробуй другую тень. Посмотри на форму и изгиб.');return;}
 render();showPiece();tone(659);tone(880,.16,.1);$('board-slot-'+id)?.classList.add('just-placed');
 if(result.complete){say('Ура! Ты собрал всех троих. Давай потанцуем!');$('start').textContent='Собрать ещё раз';$('start').hidden=false;}
 else{const c=model.characters.get(result.characterId),count=[...model.placed].filter(id=>model.parts.get(id).characterId===c.id).length;say(count===6?`${c.name} готов! Поможем остальным.`:'Подходит! Теперь следующая косточка.');}
}
function point(e){const matrix=board.getScreenCTM();return matrix?new DOMPoint(e.clientX,e.clientY).matrixTransform(matrix.inverse()):null;}
function moveGhost(e){const p=model.current;if(!p)return;const m=board.getScreenCTM();if(!m)return;const scale=Math.hypot(m.a,m.b),b=p.bounds,w=b[2]*scale,h=b[3]*scale;$('ghost').style.width=w+'px';$('ghost').style.height=h+'px';$('ghost').style.left=e.clientX-w/2+'px';$('ghost').style.top=e.clientY-h/2+'px';}
$('piece').addEventListener('pointerdown',e=>{if(model.phase!=='playing'||drag||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();ensureAudio();drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{$('piece').setPointerCapture(e.pointerId);}catch{}});
window.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;e.preventDefault();ensureAudio();if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7&&!drag.moved){drag.moved=true;const p=model.current,b=p.bounds;$('ghost-art').setAttribute('viewBox',`0 0 ${b[2]} ${b[3]}`);$('ghost-art').innerHTML=A.defs(data,'ghost')+A.sprite(p,'ghost-piece','ghost',false,[0,0,b[2],b[3]]);$('ghost').hidden=false;$('piece').classList.add('dragging');}if(drag.moved)moveGhost(e);},{passive:false});
window.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;e.preventDefault();ensureAudio();const moved=drag.moved;const p=moved?point(e):null;clearDrag();if(!moved){selectPiece();return;}const target=p&&model.dragTarget(p);attempt(target?.id||'');},{passive:false});
window.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id)clearDrag();});
$('piece').addEventListener('lostpointercapture',e=>{if(drag&&e.pointerId===drag.id&&e.pointerType==='mouse'&&!$('piece').hasPointerCapture(e.pointerId))clearDrag();});
$('piece').addEventListener('click',e=>{if(e.detail===0)selectPiece();});
board.addEventListener('click',e=>{if(!selected||model.phase!=='playing')return;const p=point(e),target=p&&model.tapTarget(p);attempt(target?.id||'');});
$('start').addEventListener('click',()=>{ensureAudio();loadFailed?loadAssets():start();});
function resize(){const next=mobile.matches?'0 155 1240 745':'0 0 1600 1000';if(board.getAttribute('viewBox')!==next){clearDrag();board.setAttribute('viewBox',next);}}
window.addEventListener('resize',resize);window.addEventListener('blur',clearDrag);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearDrag();});
async function loadAssets(){loaded=false;loadFailed=false;$('start').disabled=true;$('start').hidden=true;$('load-status').hidden=false;$('load-status').textContent='Загрузка…';
 const paths=[...new Set([backgroundURL,...Object.values(data.art).map(a=>a.texture)])];
 try{await Promise.all(paths.map(src=>new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(new Error(src));img.src=src;})));loaded=true;$('start').disabled=false;start();}
 catch{loadFailed=true;$('start').disabled=false;$('start').hidden=false;$('load-status').textContent='Рисунки не загрузились';$('start').textContent='Повторить загрузку';say('Не удалось загрузить рисунки. Проверь, что папки assets и data загружены целиком.');}
}
resize();render();showPiece();loadAssets();
})();
