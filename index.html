<!doctype html>
<html lang="ru"><head><base href="./halloween-skeletons%202/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b1835"><title>Скелеты</title><style>
:root{font-family:ui-rounded,system-ui,sans-serif;color:#fff0d6;background:#201326;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh}main{max-width:1660px;padding:12px;margin:auto}.game-shell{position:relative;border-radius:24px;overflow:hidden;background:#27162f}.stage{width:100%;aspect-ratio:1.6}#board{display:block;width:100%;height:100%}.tray{position:absolute;right:3.8%;top:23.7%;width:18.2%;height:60.1%;border-radius:34px;background:linear-gradient(140deg,#48213dea,#28152feb);border:3px solid #d9a04d;box-shadow:inset 0 0 0 7px #60344666,0 15px 35px #170d2a55;padding:24px 18px;display:flex;align-items:center;flex-direction:column;text-align:center}button{font:inherit;font-weight:650;color:#f9e6c5;background:#4b2c47;border:1px solid #b17d61;border-radius:13px;min-height:44px;cursor:pointer}button:focus-visible,[role=button]:focus-visible{outline:3px solid #ffcf79;outline-offset:4px}.tray #piece{padding:8px;min-height:0;flex:1;width:100%;background:transparent;border:1px solid transparent;border-radius:24px;touch-action:none;user-select:none;overflow:hidden}.tray #piece:hover:not(:disabled){background:#ffffff08;border-color:#d5a95b55}.tray #piece.selected{box-shadow:0 0 0 2px #edb861;background:#ffffff0a}.tray #piece.dragging svg{opacity:.2}#piece-art{width:100%;height:100%;display:block;pointer-events:none}.primary{color:#352039;background:linear-gradient(#ffdc94,#dfa053);border:1px solid #ffe8a5;width:100%;margin-top:12px;padding:12px;font-size:clamp(12px,1vw,16px)}#load-status{font-size:13px;color:#efd0ba}[hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.sprite{pointer-events:none}#board .target{cursor:pointer}#board .target:focus-visible .slot-shadow{filter:drop-shadow(0 0 6px #ffcc7e)}.installed,.head,.name-tag,.ground-shadow{pointer-events:none}.just-placed{animation:pop .25s ease-out}.dancing .actor{transform-origin:170px 620px;animation:bounce .7s ease-in-out infinite alternate}.dancing .arm-left,.dancing .leg-right{animation:swing .7s ease-in-out infinite alternate}.dancing .arm-right,.dancing .leg-left{animation:swing .7s ease-in-out infinite alternate-reverse}.dancing .character:nth-of-type(2) .actor{animation-delay:-.23s}.dancing .character:nth-of-type(3) .actor{animation-delay:-.46s}#ghost{position:fixed;pointer-events:none;z-index:50;filter:drop-shadow(0 8px 7px #180d2355)}#ghost-art{width:100%;height:100%;display:block}@keyframes pop{from{opacity:.35}to{opacity:1}}@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}@keyframes bounce{from{transform:translateY(0) rotate(-1.4deg)}to{transform:translateY(-7px) rotate(1.4deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:1100px) and (min-width:761px){main{padding:8px}.tray{padding:14px 10px;border-radius:23px}}@media(max-width:760px){main{padding:6px}.game-shell{display:flex;flex-direction:column;border-radius:18px}.stage{aspect-ratio:1240/745}.tray{position:relative;inset:auto;width:auto;height:200px;min-height:200px;border-width:1px;border-radius:18px;margin:8px 12px 12px;padding:12px;flex-direction:row;gap:12px}.tray #piece{height:174px;max-width:180px;margin:auto}.tray .primary{width:auto;max-width:160px;font-size:14px;margin:0}}

</style></head>
<body><main><section class="game-shell" aria-label="Скелеты">
<div class="stage"><svg id="board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" aria-label="Три скелета: Луна, Пиппа и Тито"></svg></div>
<aside class="tray"><button id="piece" disabled aria-label="Выбрать деталь"><svg id="piece-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 330" aria-hidden="true"></svg></button><p id="load-status" role="status">Загрузка…</p><button class="primary" id="start" hidden>Собрать ещё раз</button></aside>
<p id="message" class="sr-only" role="status" aria-live="polite"></p><span id="progress" class="sr-only"></span>
</section></main>
<div id="ghost" hidden><svg xmlns="http://www.w3.org/2000/svg" id="ghost-art" aria-hidden="true"></svg></div>
<script src="data/game-data.js"></script><script src="art.js"></script><script src="engine.js"></script><script>
(() => {
'use strict';
const data=window.SKELETON_GAME_DATA,A=window.SkeletonArt,model=new window.SkeletonEngine(data);
const $=id=>document.getElementById(id),board=$('board');
let selected=false,drag=null,loaded=false,loadFailed=false,audio=null,ignoreClickUntil=0;
const mobile=window.matchMedia('(max-width:760px)');
function say(s){$('message').textContent=s;}
function picture(a,prefix,width=240,height=330){const r=a.sourceRect,scale=Math.min((width-24)/r[2],(height-22)/r[3]);return A.defs(data,prefix)+A.sprite(a,prefix+'-piece',prefix,false,[(width-r[2]*scale)/2,(height-r[3]*scale)/2,r[2]*scale,r[3]*scale]);}
function render(){
 board.innerHTML=A.defs(data,'board')+'<image href="assets/background.png" width="1600" height="1000" preserveAspectRatio="xMidYMid slice"/><rect width="1600" height="1000" fill="#221430" opacity=".13"/>'+data.characters.map(c=>A.character(data,c,'board',model.placed,model.phase==='complete',model.phase==='playing')).join('');
 board.classList.toggle('dancing',model.phase==='complete');
 for(const p of data.parts){const g=$('board-slot-'+p.id);if(g&&!model.placed.has(p.id))g.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selected){e.preventDefault();attempt(p.id);}});}
 $('progress').textContent=`${model.placed.size} / 18`;

}
function showPiece(){
 const p=model.current;selected=false;$('piece').classList.remove('selected','dragging');
 const playing=loaded&&model.phase==='playing';$('piece').disabled=!playing;
 $('piece').setAttribute('aria-pressed','false');
 if(p){$('piece').setAttribute('aria-label',`Выбрать деталь: ${p.label}`);$('piece-art').innerHTML=picture(p,'tray');}
 else{$('piece-art').innerHTML=picture(data.art['tito-maraca'],'tray');}
}
function selectPiece(){if(model.phase!=='playing')return;ensureAudio();selected=true;$('piece').classList.add('selected');$('piece').setAttribute('aria-pressed','true');say('Теперь нажми на подходящую тень.');}
function clearDrag(){if(drag){const id=drag.id;drag=null;try{if($('piece').hasPointerCapture(id))$('piece').releasePointerCapture(id);}catch{}}$('ghost').hidden=true;$('piece').classList.remove('dragging');}
function ensureAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C();}if(audio?.state==='suspended')audio.resume().catch(()=>{});}catch{}}
function tone(freq,duration=.14,delay=0){if(document.hidden)return;ensureAudio();if(!audio)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.055,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration+.03);}
function start(){if(!loaded)return;clearDrag();model.start();$('start').hidden=true;$('load-status').hidden=true;render();showPiece();say('Сравни форму и изгиб. Кому подходит эта деталь?');}
function attempt(id){if(model.phase!=='playing')return;const result=model.place(id);if(!result.ok){say('Попробуй другую тень. Посмотри на форму и изгиб.');return;}
 tone(659);tone(880,.16,.1);render();showPiece();$('board-slot-'+id)?.classList.add('just-placed');
 if(result.complete){say('Ура! Ты собрал всех троих. Давай потанцуем!');$('start').textContent='Собрать ещё раз';$('start').hidden=false;}
 else{const c=model.characters.get(result.characterId),count=[...model.placed].filter(id=>model.parts.get(id).characterId===c.id).length;say(count===6?`${c.name} готов! Поможем остальным.`:'Подходит! Теперь следующая косточка.');}
}
function point(e){const matrix=board.getScreenCTM();return matrix?new DOMPoint(e.clientX,e.clientY).matrixTransform(matrix.inverse()):null;}
function moveGhost(e){const p=model.current;if(!p)return;const m=board.getScreenCTM();if(!m)return;const scale=Math.hypot(m.a,m.b),b=p.bounds,w=b[2]*scale,h=b[3]*scale;$('ghost').style.width=w+'px';$('ghost').style.height=h+'px';$('ghost').style.left=e.clientX-w/2+'px';$('ghost').style.top=e.clientY-h/2+'px';}
$('piece').addEventListener('pointerdown',e=>{if(model.phase!=='playing'||drag||(e.pointerType==='mouse'&&e.button!==0))return;ensureAudio();drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};$('piece').setPointerCapture(e.pointerId);});
$('piece').addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7&&!drag.moved){drag.moved=true;const p=model.current,b=p.bounds;$('ghost-art').setAttribute('viewBox',`0 0 ${b[2]} ${b[3]}`);$('ghost-art').innerHTML=A.defs(data,'ghost')+A.sprite(p,'ghost-piece','ghost',false,[0,0,b[2],b[3]]);$('ghost').hidden=false;$('piece').classList.add('dragging');}if(drag.moved)moveGhost(e);});
$('piece').addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const moved=drag.moved;clearDrag();ignoreClickUntil=performance.now()+350;if(!moved){selectPiece();return;}const p=point(e),target=p&&model.dragTarget(p);attempt(target?.id||'');});
$('piece').addEventListener('pointercancel',clearDrag);$('piece').addEventListener('lostpointercapture',clearDrag);
$('piece').addEventListener('click',e=>{if(e.detail===0&&performance.now()>ignoreClickUntil)selectPiece();});
board.addEventListener('click',e=>{if(!selected||model.phase!=='playing'||performance.now()<ignoreClickUntil)return;const p=point(e),target=p&&model.tapTarget(p);attempt(target?.id||'');});
$('start').addEventListener('click',()=>{ensureAudio();loadFailed?loadAssets():start();});
function resize(){clearDrag();board.setAttribute('viewBox',mobile.matches?'0 155 1240 745':'0 0 1600 1000');}
window.addEventListener('resize',resize);window.addEventListener('blur',clearDrag);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearDrag();});
async function loadAssets(){loaded=false;loadFailed=false;$('start').disabled=true;$('start').hidden=true;$('load-status').hidden=false;$('load-status').textContent='Загрузка…';
 const paths=[...new Set(['assets/background.png',...Object.values(data.art).map(a=>a.texture)])];
 try{await Promise.all(paths.map(src=>new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(new Error(src));img.src=src;})));loaded=true;$('start').disabled=false;start();}
 catch{loadFailed=true;$('start').disabled=false;$('start').hidden=false;$('load-status').textContent='Рисунки не загрузились';$('start').textContent='Повторить загрузку';say('Не удалось загрузить рисунки. Проверь, что папки assets и data загружены целиком.');}
}
resize();render();showPiece();loadAssets();
})();

</script>
</body></html>
