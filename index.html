<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102d64">
<title>Поймай привидение</title>
<style>
  :root { color-scheme: dark; font-family: "Trebuchet MS", "Arial", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #071631; color: #f3fbff; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; }
  button:focus-visible { outline: 5px solid #fff1ac; outline-offset: 7px; }
  [hidden] { display: none !important; }
  #viewport { position: fixed; inset: 0; display: grid; place-items: center; background: #071631; }
  #frame { position: relative; overflow: hidden; }
  #game { position: absolute; width: 1920px; height: 1080px; transform-origin: top left; overflow: hidden; isolation: isolate; background: #102d64; }
  .background { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
  #game::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #061b443d, transparent 42%); z-index: -1; pointer-events: none; }
  .background { z-index: -2; }
  .toolbar { position: absolute; top: 32px; left: 40px; right: 40px; display: flex; justify-content: space-between; align-items: start; z-index: 5; pointer-events: none; }
  .toolbar button { pointer-events: auto; }
  .utility { border: 2px solid #c0eaff60; background: #112e65b8; border-radius: 28px; height: 88px; padding: 0 30px; font-size: 28px; box-shadow: 0 5px 20px #00142e24; }
  .utility:hover { background: #244b81ed; }
  #fullscreen { margin-left: auto; width: 88px; padding: 22px; }
  #fullscreen svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 2; }
  #menu { position: absolute; inset: 0; text-align: center; padding-top: 95px; background: linear-gradient(#06193929, #12396612); }
  .eyebrow { margin: 0 0 15px; color: #c5e9ff; font-size: 21px; letter-spacing: 5px; text-transform: uppercase; }
  h1 { font-size: 76px; letter-spacing: -2px; margin: 0; font-weight: 700; text-shadow: 0 5px 26px #02173588; }
  .intro { font-size: 28px; margin: 21px 0 40px; color: #e3f4ff; }
  #cards { width: 1640px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 26px 25px; }
  .card { position: relative; padding: 0; width: 210px; height: 210px; border: 0; border-radius: 35px; background: transparent; transition: transform .18s ease, filter .18s ease; }
  .card img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
  .card:hover { transform: translateY(-5px); filter: brightness(1.08); }
  .card[aria-pressed="true"] { filter: drop-shadow(0 0 13px #e2fca5) drop-shadow(0 0 5px #b9f9ff); transform: translateY(-4px); }
  .badge { position: absolute; right: -2px; top: -4px; min-width: 43px; height: 43px; padding: 0 9px; display: grid; place-items: center; background: #fff3b6; color: #204568; font-size: 25px; font-weight: bold; border: 3px solid #fffbe2; border-radius: 50%; box-shadow: 0 3px 10px #11345950; }
  .actions { display: flex; justify-content: center; gap: 24px; margin-top: 45px; }
  .action { min-height: 82px; border-radius: 26px; padding: 15px 42px; font-size: 29px; font-weight: bold; border: 2px solid #c9efff80; background: #174477d9; box-shadow: 0 6px 22px #00182c38; }
  .action:hover { filter: brightness(1.1); }
  .primary { color: #153858; border-color: #f4ffeb; background: linear-gradient(135deg, #e3ffe7, #a5e4ee); box-shadow: 0 4px 0 #518cad, 0 8px 30px #acf5f52b; }
  .action:disabled { opacity: .45; filter: none; }
  .hint { font-size: 22px; color: #d5e9fc; margin: 23px 0 0; }
  #field { position: absolute; inset: 0; }
  #flightHint { text-align: center; position: absolute; top: 46px; width: 100%; font-size: 29px; letter-spacing: .4px; margin: 0; color: #f2fbff; text-shadow: 0 2px 15px #001335; pointer-events: none; }
  #ghost { position: absolute; left: 0; top: 0; width: 290px; height: 330px; padding: 12px; border: 0; background: transparent; opacity: 0; will-change: transform, opacity; pointer-events: none; }
  #ghost img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; filter: drop-shadow(0 0 19px #d9f9ff5c); }
  #ghost:focus-visible { border-radius: 48%; }
  #sparkles { position: absolute; inset: 0; pointer-events: none; }
  .spark { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff9c9; box-shadow: 0 0 20px #ddfbff; animation: sparkle .65s ease-out forwards; }
  @keyframes sparkle { from { transform: translate(-50%,-50%) scale(.6); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15); opacity: 0; } }
  #overlay { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; background: #0316308c; }
  #exercise, #finish { text-align: center; }
  #exerciseImage { display: block; width: 620px; height: 620px; object-fit: contain; margin: 0 auto 24px; filter: drop-shadow(0 0 32px #a7eaff3b); user-select: none; }
  #done { min-width: 255px; }
  #finish { width: 820px; border: 2px solid #b7e7ff80; border-radius: 48px; padding: 62px 45px; background: linear-gradient(145deg,#244b80f5,#163762f5); box-shadow: 0 20px 80px #00112655, inset 0 1px 0 #ecffff60; }
  #finish h2 { font-size: 49px; line-height: 1.2; margin: 0 0 20px; }
  #finish p { font-size: 31px; margin: 0; color: #deefff; }
  #finish .actions { margin-top: 37px; }
  #notice { position: absolute; bottom: 20px; left: 230px; right: 230px; z-index: 10; padding: 16px 24px; border-radius: 20px; background: #102a51f2; font-size: 22px; text-align: center; }
  #assetStatus { margin: 12px auto 0; max-width: 1530px; font-size: 19px; color: #fff2c9; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .spark { animation-duration: .25s; } }
</style>
</head>
<body>
<div id="viewport"><div id="frame"><main id="game" aria-label="Игра Поймай привидение">
  <img class="background" src="./background.png" alt="" draggable="false">
  <div class="toolbar">
    <button id="menuButton" class="utility" hidden>В меню</button>
    <button id="fullscreen" class="utility" aria-label="Полный экран" title="Полный экран" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="fullscreenIcon" d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
    </button>
  </div>
  <section id="menu" aria-labelledby="title">
    <p class="eyebrow">Маленькое приключение для язычка</p>
    <h1 id="title">Поймай привидение</h1>
    <p class="intro">Выберите картинки в том порядке, в котором хотите поиграть</p>
    <div id="cards" role="group" aria-label="Выбор упражнений"></div>
    <div class="actions">
      <button id="reset" class="action" disabled>Сбросить выбор</button>
      <button id="start" class="action primary" disabled>Начать игру</button>
    </div>
    <p class="hint">Нажмите на выбранную картинку ещё раз, чтобы убрать её</p>
    <p id="assetStatus" role="status"></p>
  </section>
  <section id="field" aria-label="Полянка" hidden>
    <p id="flightHint">Поймай привидение!</p>
    <button id="ghost" aria-label="Поймать привидение" disabled tabindex="-1"><img id="ghostImage" alt="" draggable="false"></button>
    <div id="sparkles" aria-hidden="true"></div>
  </section>
  <div id="overlay" hidden>
    <section id="exercise" role="dialog" aria-modal="true" aria-label="Выполните упражнение" hidden>
      <img id="exerciseImage" alt="" draggable="false">
      <button id="done" class="action primary">Готово</button>
    </section>
    <section id="finish" role="dialog" aria-modal="true" aria-labelledby="finishTitle" hidden>
      <h2 id="finishTitle">Отлично поиграли!</h2>
      <p>Хочешь ещё?</p>
      <div class="actions"><button id="again" class="action primary">Ещё раз</button><button id="finishMenu" class="action">В меню</button></div>
    </section>
  </div>
  <div id="notice" role="status" hidden></div>
</main></div></div>
<script>
'use strict';
// Все размеры — в координатах поля 1920 × 1080; время — в миллисекундах.
const SETTINGS = Object.freeze({
  width: 1920, height: 1080,
  visibleMs: 4700, pauseMs: 650, fadeInMs: 220, fadeOutStartMs: 1600,
  catchEffectMs: 330, angularSpeed: 0.34,
  ghostWidth: 290, ghostHeight: 330,
  centerX: 960, centerY: 590, radiusX: 690, radiusY: 250,
  minCatchOpacity: 0.12
});
const EXERCISES = [
  ['smile', 'Улыбочка', '01_Ulybochka_smile.png'],
  ['trumpet', 'Трубочка', '02_Trubochka_trumpet.png'],
  ['swing', 'Качели', '03_Kacheli.png'],
  ['fence', 'Заборчик', '04_Zaborchik.png'],
  ['hippo', 'Бегемот', '05_Begemot.png'],
  ['cup', 'Чашечка', '06_Chashechka.png'],
  ['needle', 'Иголочка', '07_Igolochka.png'],
  ['shovel', 'Лопатка', '08_Lopatka.png'],
  ['jam', 'Вкусное варенье', '09_Vkusnoe_varenye.png'],
  ['sail', 'Парус', '10_Parus.png'],
  ['woodpecker', 'Дятел', '11_Dyatel.png'],
  ['mosquito', 'Комарик', '12_Komarik.png'],
  ['horse', 'Лошадка', '13_Loshadka.png'],
  ['slide', 'Горка', 'gorka.png']
].map(([id, name, file]) => ({ id, name, file }));
const GHOSTS = ['ghost_01.png', 'ghost_02.png', 'ghost_03_fixed.png', 'ghost_04.png'];
const $ = id => document.getElementById(id);
const ui = Object.fromEntries(['viewport','frame','game','menu','cards','start','reset','assetStatus','field','ghost','ghostImage','sparkles','overlay','exercise','exerciseImage','done','finish','again','menuButton','finishMenu','fullscreen','fullscreenIcon','notice'].map(id => [id, $(id)]));
let selected = [], sequence = [], exerciseIndex = 0;
let state = 'menu', assetsReady = false, ghostIndex = -1;
let raf = 0, catchTimer = 0, noticeTimer = 0;
let elapsed = 0, lastTime = 0, phase = 0, direction = 1, opacity = 0;
let ghostX = 0, ghostY = 0;
const cardButtons = new Map();

function resize() {
  const scale = Math.min(ui.viewport.clientWidth / SETTINGS.width, ui.viewport.clientHeight / SETTINGS.height);
  ui.frame.style.width = `${SETTINGS.width * scale}px`;
  ui.frame.style.height = `${SETTINGS.height * scale}px`;
  ui.game.style.transform = `scale(${scale})`;
}
new ResizeObserver(resize).observe(ui.viewport);
resize();

for (const item of EXERCISES) {
  const button = document.createElement('button');
  button.className = 'card';
  button.dataset.id = item.id;
  button.setAttribute('aria-label', item.name);
  button.setAttribute('aria-pressed', 'false');
  const img = document.createElement('img');
  img.src = `./${item.file}`;
  img.alt = ''; // Название доступно скринридеру через кнопку; видимых подписей нет.
  img.draggable = false;
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.setAttribute('aria-hidden', 'true');
  badge.hidden = true;
  button.append(img, badge);
  button.addEventListener('click', () => {
    if (state !== 'menu') return;
    const index = selected.indexOf(item.id);
    if (index === -1) selected.push(item.id);
    else selected.splice(index, 1);
    renderSelection();
  });
  ui.cards.append(button);
  cardButtons.set(item.id, button);
}
function renderSelection() {
  for (const item of EXERCISES) {
    const button = cardButtons.get(item.id);
    const index = selected.indexOf(item.id);
    button.setAttribute('aria-pressed', String(index >= 0));
    button.setAttribute('aria-label', item.name + (index >= 0 ? `, выбор ${index + 1}` : ''));
    const badge = button.querySelector('.badge');
    badge.hidden = index < 0;
    badge.textContent = index < 0 ? '' : String(index + 1);
  }
  ui.start.disabled = !selected.length || !assetsReady;
  ui.reset.disabled = !selected.length;
}
ui.reset.addEventListener('click', () => { selected = []; renderSelection(); });

// Загрузка идёт прямо в меню; отдельного экрана загрузки нет.
async function preload(file) {
  const img = new Image();
  img.src = `./${file}`;
  try { await img.decode(); return null; } catch { return file; }
}
Promise.all(['background.png', ...EXERCISES.map(item => item.file), ...GHOSTS].map(preload)).then(results => {
  const missing = results.filter(Boolean);
  assetsReady = !missing.length;
  ui.assetStatus.textContent = missing.length ? `Не удалось открыть изображения: ${missing.join(', ')}. Проверьте файлы и обновите страницу.` : '';
  renderSelection();
});

function hideGhost() {
  opacity = 0;
  ui.ghost.style.opacity = '0';
  ui.ghost.style.pointerEvents = 'none';
  ui.ghost.disabled = true;
  ui.ghost.tabIndex = -1;
  ui.ghost.setAttribute('aria-hidden', 'true');
}
function stopFlight() {
  cancelAnimationFrame(raf);
  raf = 0;
  clearTimeout(catchTimer);
  catchTimer = 0;
  hideGhost();
}
function closeOverlay() {
  ui.overlay.hidden = true;
  ui.exercise.hidden = true;
  ui.finish.hidden = true;
  ui.field.inert = false;
}
function showMenu() {
  state = 'menu';
  stopFlight();
  closeOverlay();
  ui.field.hidden = true;
  ui.menu.hidden = false;
  ui.menuButton.hidden = true;
  ui.sparkles.replaceChildren();
  renderSelection();
  (cardButtons.get(selected[0]) || cardButtons.get(EXERCISES[0].id)).focus({ preventScroll: true });
}
function startGame(replay = false) {
  if (!assetsReady || (!replay && !selected.length)) return;
  stopFlight();
  if (!replay) sequence = [...selected];
  exerciseIndex = 0;
  ghostIndex = -1;
  ui.menu.hidden = true;
  ui.field.hidden = false;
  ui.menuButton.hidden = false;
  closeOverlay();
  spawnGhost();
  scheduleFrame();
}
function spawnGhost() {
  state = 'flying';
  elapsed = 0;
  // Смена строго по кругу: ни одно из четырёх привидений не пропускается.
  ghostIndex = (ghostIndex + 1) % GHOSTS.length;
  ui.ghostImage.src = `./${GHOSTS[ghostIndex]}`;
  phase += 1.2 + Math.random() * 3.6;
  direction = Math.random() < 0.5 ? -1 : 1;
  drawGhost();
}
function drawGhost() {
  const seconds = elapsed / 1000;
  const angle = phase + direction * seconds * SETTINGS.angularSpeed;
  ghostX = SETTINGS.centerX + Math.cos(angle) * SETTINGS.radiusX - SETTINGS.ghostWidth / 2;
  ghostY = SETTINGS.centerY + Math.sin(angle) * SETTINGS.radiusY + Math.sin(seconds * 2.5) * 12 - SETTINGS.ghostHeight / 2;
  opacity = Math.max(0, Math.min(1, elapsed / SETTINGS.fadeInMs,
    (SETTINGS.visibleMs - elapsed) / (SETTINGS.visibleMs - SETTINGS.fadeOutStartMs)));
  ui.ghost.style.transform = `translate(${ghostX}px, ${ghostY}px)`;
  ui.ghostImage.style.transform = `rotate(${Math.sin(angle) * 5}deg)`;
  ui.ghost.style.opacity = String(opacity);
  const catchable = opacity >= SETTINGS.minCatchOpacity;
  ui.ghost.disabled = !catchable;
  ui.ghost.tabIndex = catchable ? 0 : -1;
  ui.ghost.style.pointerEvents = catchable ? 'auto' : 'none';
  ui.ghost.setAttribute('aria-hidden', String(!catchable));
}
function scheduleFrame() {
  if (document.hidden) return;
  lastTime = performance.now();
  raf = requestAnimationFrame(tick);
}
function tick(now) {
  if (state !== 'flying' && state !== 'gap') { raf = 0; return; }
  elapsed += Math.min(50, Math.max(0, now - lastTime));
  lastTime = now;
  if (state === 'flying') {
    if (elapsed >= SETTINGS.visibleMs) {
      // Сохраняем конечную фазу, чтобы новое появление было в другом месте.
      phase += direction * elapsed / 1000 * SETTINGS.angularSpeed;
      state = 'gap'; elapsed = 0; hideGhost();
    } else drawGhost();
  } else if (elapsed >= SETTINGS.pauseMs) spawnGhost();
  raf = requestAnimationFrame(tick);
}
function catchGhost() {
  if (state !== 'flying' || opacity < SETTINGS.minCatchOpacity || ui.ghost.disabled) return;
  // Блокировка синхронна: второй pointerdown/click не может повторить поимку.
  state = 'caught';
  stopFlight();
  ui.sparkles.replaceChildren();
  for (let i = 0; i < 12; i++) {
    const spark = document.createElement('i');
    spark.className = 'spark';
    spark.style.left = `${ghostX + SETTINGS.ghostWidth / 2}px`;
    spark.style.top = `${ghostY + SETTINGS.ghostHeight / 2}px`;
    spark.style.setProperty('--dx', `${Math.cos(i * Math.PI / 6) * 180}px`);
    spark.style.setProperty('--dy', `${Math.sin(i * Math.PI / 6) * 160}px`);
    ui.sparkles.append(spark);
  }
  catchTimer = setTimeout(() => {
    if (state !== 'caught') return;
    state = 'exercise';
    const item = EXERCISES.find(item => item.id === sequence[exerciseIndex]);
    ui.exerciseImage.src = `./${item.file}`;
    ui.exerciseImage.alt = item.name;
    ui.overlay.hidden = false;
    ui.exercise.hidden = false;
    ui.field.inert = true;
    ui.done.focus({ preventScroll: true });
  }, SETTINGS.catchEffectMs);
}
ui.ghost.addEventListener('pointerdown', event => {
  if (!event.isPrimary || (event.pointerType === 'mouse' && event.button !== 0)) return;
  event.preventDefault();
  catchGhost();
});
ui.ghost.addEventListener('click', catchGhost); // Клавиатура и вспомогательные технологии.
ui.done.addEventListener('click', () => {
  if (state !== 'exercise') return;
  exerciseIndex++;
  ui.exercise.hidden = true;
  ui.sparkles.replaceChildren();
  if (exerciseIndex === sequence.length) {
    state = 'finished';
    ui.finish.hidden = false;
    ui.again.focus({ preventScroll: true });
  } else {
    closeOverlay();
    spawnGhost();
    scheduleFrame();
    ui.menuButton.focus({ preventScroll: true });
  }
});
ui.start.addEventListener('click', () => { if (state === 'menu') startGame(); });
ui.again.addEventListener('click', () => { if (state === 'finished') startGame(true); });
ui.menuButton.addEventListener('click', showMenu);
ui.finishMenu.addEventListener('click', showMenu);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else if (state === 'flying' || state === 'gap') scheduleFrame();
});
// Модальные окна удерживают клавиатурный фокус; Escape возвращает к выбору.
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && state !== 'menu' && !document.fullscreenElement) showMenu();
  if (event.key !== 'Tab' || ui.overlay.hidden) return;
  const panel = state === 'finished' ? ui.finish : ui.exercise;
  const buttons = [...panel.querySelectorAll('button'), ui.menuButton, ui.fullscreen];
  const index = buttons.indexOf(document.activeElement);
  event.preventDefault();
  buttons[(index + (event.shiftKey ? -1 : 1) + buttons.length) % buttons.length].focus();
});
function notify(message) {
  clearTimeout(noticeTimer);
  ui.notice.textContent = message;
  ui.notice.hidden = false;
  noticeTimer = setTimeout(() => { ui.notice.hidden = true; }, 6000);
}
ui.fullscreen.addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (ui.viewport.requestFullscreen) await ui.viewport.requestFullscreen();
    else notify('Этот браузер не поддерживает полный экран. Откройте игру в отдельной вкладке.');
  } catch { notify('Полный экран недоступен. Разрешите его для iframe или откройте игру в отдельной вкладке.'); }
});
document.addEventListener('fullscreenchange', () => {
  const full = !!document.fullscreenElement;
  ui.fullscreen.setAttribute('aria-pressed', String(full));
  ui.fullscreen.setAttribute('aria-label', full ? 'Выйти из полного экрана' : 'Полный экран');
  ui.fullscreen.title = full ? 'Выйти из полного экрана' : 'Полный экран';
  ui.fullscreenIcon.setAttribute('d', full ? 'M3 8h5V3m13 5h-5V3M8 21v-5H3m13 5v-5h5' : 'M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5');
  resize();
});
</script>
</body>
</html>
